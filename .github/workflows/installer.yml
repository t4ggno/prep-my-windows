name: Windows Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.13
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Set release metadata
        shell: pwsh
        run: |
          $config = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $version = $config.version
          $productName = $config.productName

          if (-not $version -or -not $productName) {
            throw "Tauri productName and version are required"
          }

          "RELEASE_TAG=v$version-build.$env:GITHUB_RUN_ID.$env:GITHUB_RUN_ATTEMPT" >> $env:GITHUB_ENV
          "RELEASE_TITLE=$productName v$version (build $env:GITHUB_RUN_ID.$env:GITHUB_RUN_ATTEMPT)" >> $env:GITHUB_ENV

      - name: Build Windows installer
        run: npm run tauri -- build

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $installers = @(Get-ChildItem src-tauri/target/release/bundle/nsis -Filter *-setup.exe -File)

          if ($installers.Count -eq 0) {
            throw "No NSIS installer was generated"
          }

          $installerPaths = @($installers | ForEach-Object FullName)
          gh release create $env:RELEASE_TAG @installerPaths `
            --generate-notes `
            --target $env:GITHUB_SHA `
            --title $env:RELEASE_TITLE

          if ($LASTEXITCODE -ne 0) {
            throw "GitHub Release creation failed"
          }
