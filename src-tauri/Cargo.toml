[package]
name = "prep-my-windows"
version = "1.0.0"
description = "Enforce a personal Windows 11 policy"
authors = ["Machdoch"]
edition = "2024"

[lib]
name = "prep_my_windows_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
chrono = { version = "0.4.42", features = ["serde"] }
parking_lot = "0.12.5"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sysinfo = "0.39.6"
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-single-instance = "2.4.3"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["time", "rt-multi-thread", "sync"] }
uuid = { version = "1.18.1", features = ["v4", "serde"] }
winreg = "0.56.0"
windows-sys = { version = "0.61.2", features = ["Win32_System_Power", "Win32_System_SystemServices", "Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging"] }
