[package]
name = "prep-my-windows"
version = "1.4.1"
description = "Enforce a personal Windows 11 policy"
authors = ["Machdoch"]
edition = "2024"

[lib]
name = "prep_my_windows_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
parking_lot = "0.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = "0.40.4"
tauri = { version = "2.12.7", features = ["tray-icon"] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-opener = "2.7.3"
tauri-plugin-process = "2.4.0"
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-updater = "=2.14.1"
tokio = { version = "1.54.1", features = ["time", "rt-multi-thread", "sync", "macros"] }
tokio-util = "0.7.20"
uuid = { version = "1.29.3", features = ["v4", "serde"] }
winreg = "0.56.0"
windows = { version = "0.62.2", features = ["Data_Xml_Dom", "Foundation", "UI_Notifications"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Power", "Win32_System_Services", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging"] }
wmi = { version = "0.18.4", default-features = false }
